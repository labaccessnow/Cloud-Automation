# Hybrid connectivity: WireGuard site-to-site, a cloud VM as the hub and on-prem as a
# peer. Cheap, fast, and it survives carrier-grade NAT on the home side (the cloud end
# has the public IP and listens; the on-prem end dials out and keepalives the tunnel).

# ---- cloud hub: /etc/wireguard/wg0.conf ----
[Interface]
Address    = 0.0.0.0/24
ListenPort = 51820
PrivateKey = <cloud-private-key>

[Peer]                                  # the on-prem router/host
PublicKey  = <onprem-public-key>
AllowedIPs = 0.0.0.0/32, 0.0.0.0/24  # tunnel IP + the on-prem LAN routed over WG

# ---- on-prem peer: /etc/wireguard/wg0.conf ----
# [Interface]
# Address    = 0.0.0.0/24
# PrivateKey = <onprem-private-key>
#
# [Peer]                                # the cloud hub
# PublicKey           = <cloud-public-key>
# Endpoint            = cloud.example.com:51820
# AllowedIPs          = 0.0.0.0/24, <cloud-vnet-cidr>
# PersistentKeepalive = 25              # hold the tunnel open through NAT
